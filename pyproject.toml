[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcn"
version = "1.0.0"
description = "Income, education and inequality across Barcelona's neighbourhoods (Python + SQL/DuckDB)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy", "pandas", "scipy", "matplotlib", "geopandas", "shapely", "pyproj", "pyogrio",
    "statsmodels", "scikit-learn", "libpysal", "esda", "spreg", "mapclassify", "requests",
    "tabulate", "duckdb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B905"]  # zip() over palettes intentionally truncates

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
